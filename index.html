<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento · A.N.E</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #0b1020;
      --card: #141a2e;
      --line: #2a3354;
      --text: #e8eef8;
      --muted: #8b95b0;
      --gold: #e0a84a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2450 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 16px 48px;
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 22px; }
    .brand {
      letter-spacing: 0.28em;
      font-size: 12px;
      color: var(--gold);
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 { font-size: 28px; font-weight: 650; margin: 10px 0 6px; }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.45; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }
    h2 { font-size: 18px; font-weight: 650; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .qr {
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      justify-content: center;
    }
    .qr img {
      width: 100%;
      max-width: 360px;
      height: auto;
      display: block;
    }
    footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
